[package]
name = "jidr-ui"
description = "Jidr Slint GUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-only"
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
jidr-core.workspace = true
jidr-client.workspace = true
jidr-proto.workspace = true
jidr-sdk.workspace = true
slint = { workspace = true, features = ["unstable-winit-030"] }
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
png.workspace = true
tracing.workspace = true
dirs.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "system-proxy"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSButton", "NSControl", "NSMenu", "NSMenuItem", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSString"] }

[build-dependencies]
slint-build = "1.18.1"
serde_json.workspace = true

[dev-dependencies]
jidr-daemon.workspace = true
jidr-backend.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[features]
# Tests that need a running Android emulator (Linux KVM in CI, arm64 on an Apple Silicon Mac).
emulator = []

[[example]]
name = "snapshot"
path = "examples/snapshot.rs"
