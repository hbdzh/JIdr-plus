name: Release

# Build release assets for this repository. Signing and notarization are optional;
# configure the MAC_DEVELOPER_ID_* and MAC_NOTARY_* secrets to enable them.
# Without signing credentials the build is ad-hoc signed and not notarized.
# Homebrew, MCP Registry and site publication require separate configuration
# and are deliberately not performed by this workflow.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.0
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-arm64:
    name: macOS arm64 DMG
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      version: ${{ steps.sums.outputs.version }}
      dmg_sha256: ${{ steps.sums.outputs.dmg_sha256 }}
      mcpb_sha256: ${{ steps.sums.outputs.mcpb_sha256 }}
      signed: ${{ env.HAVE_SIGNING }}
    env:
      HAVE_SIGNING: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Install Rust (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import the Developer ID certificate
        if: env.HAVE_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.MAC_NOTARY_KEY_P8_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          [ -n "$identity" ] || { echo "::error::no Developer ID Application identity in the certificate"; exit 1; }
          echo "JIDR_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"

      - name: Build, sign, package and scan
        env:
          NOTARY_KEY_ID: ${{ secrets.MAC_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MAC_NOTARY_ISSUER_ID }}
        run: cargo xtask release --scan --out dist

      - name: Check the version matches the tag
        id: sums
        run: |
          version="$(cat dist/VERSION)"
          [ "v${version}" = "${{ inputs.tag }}" ] || { echo "::error::built ${version}, tag is ${{ inputs.tag }}"; exit 1; }
          {
            echo "version=${version}"
            echo "dmg_sha256=$(awk '/\.dmg$/ {print $1}' dist/SHA256SUMS.txt)"
            echo "mcpb_sha256=$(awk '/\.mcpb$/ {print $1}' dist/SHA256SUMS.txt)"
          } >> "$GITHUB_OUTPUT"

      - name: Gatekeeper check
        if: env.HAVE_SIGNING == 'true'
        run: packaging/macos/verify.sh dist/Jidr-*-arm64.dmg

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" dist/Jidr-*-arm64.dmg dist/jidr-mcp-*.mcpb dist/SHA256SUMS.txt --clobber

      - name: Remove the signing keychain and the API key
        if: always() && env.HAVE_SIGNING == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary-key.p8"
