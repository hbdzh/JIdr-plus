name: Release

# Build release assets for this repository. Signing and notarization are optional;
# configure the MAC_DEVELOPER_ID_* and MAC_NOTARY_* secrets to enable them.
# Without signing credentials the build is ad-hoc signed and not notarized.
# MCP Registry publication requires separate configuration
# and are deliberately not performed by this workflow.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.0
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-arm64:
    name: macOS arm64 DMG
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      version: ${{ steps.sums.outputs.version }}
      dmg_sha256: ${{ steps.sums.outputs.dmg_sha256 }}
      mcpb_sha256: ${{ steps.sums.outputs.mcpb_sha256 }}
      signed: ${{ env.HAVE_SIGNING }}
    env:
      HAVE_SIGNING: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 != '' }}
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Expected a stable version tag such as v0.10.0'; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Install Rust (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Reuse the verified published core, or an optional pinned HTTPS source.
      - name: Prepare required runtime
        uses: ./.github/actions/prepare-miko-runtime
        with:
          core-url: ${{ vars.MIKO_RUNTIME_CORE_URL }}

      - name: Import the Developer ID certificate
        if: env.HAVE_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.MAC_NOTARY_KEY_P8_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          [ -n "$identity" ] || { echo "::error::no Developer ID Application identity in the certificate"; exit 1; }
          echo "MIKO_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"

      - name: Build, sign, package and scan
        env:
          NOTARY_KEY_ID: ${{ secrets.MAC_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MAC_NOTARY_ISSUER_ID }}
        run: cargo xtask release --scan --out dist

      - name: Check the version matches the tag
        id: sums
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version="$(cat dist/VERSION)"
          [ "v${version}" = "$RELEASE_TAG" ] || { echo "::error::built ${version}, tag is $RELEASE_TAG"; exit 1; }
          {
            echo "version=${version}"
            echo "dmg_sha256=$(awk '/\.dmg$/ {print $1}' dist/SHA256SUMS.txt)"
            echo "mcpb_sha256=$(awk '/\.mcpb$/ {print $1}' dist/SHA256SUMS.txt)"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare MCP Registry metadata for this release
        env:
          VERSION: ${{ steps.sums.outputs.version }}
          MCPB_SHA256: ${{ steps.sums.outputs.mcpb_sha256 }}
        run: |
          [ -n "$MCPB_SHA256" ] || { echo "::error::no MCP bundle checksum"; exit 1; }
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/miko-mcp-${VERSION}-darwin-arm64.mcpb"
          jq --arg v "$VERSION" --arg u "$url" --arg s "$MCPB_SHA256" \
            '.version = $v | .packages[0].identifier = $u | .packages[0].fileSha256 = $s' \
            server.json > dist/mcp-registry.json

      - name: Gatekeeper check
        if: env.HAVE_SIGNING == 'true'
        run: packaging/macos/verify.sh dist/miko-simulator-*-arm64.dmg

      # Attach pinned source-review materials; this does not bypass the
      # independent runtime redistribution review in cargo xtask release.
      - name: Prepare runtime source-review materials
        run: scripts/prepare-runtime-sources.sh dist

      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/miko-simulator-*-arm64.dmg dist/miko-mcp-*.mcpb dist/SHA256SUMS.txt dist/mcp-registry.json dist/miko-runtime-source-review-0.10.0.tar.gz dist/miko-runtime-source-projects-0.10.0.tar dist/miko-runtime-dependency-sources-0.10.0.tar.gz --clobber

      - name: Publish the completed draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
          if [ "$is_draft" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi

      - name: Remove the signing keychain and the API key
        if: always() && env.HAVE_SIGNING == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary-key.p8"
