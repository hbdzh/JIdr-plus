name: Check release packaging

# Manually verify the selected branch without creating a GitHub Release.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Build and scan unsigned test packages
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # Reuse the verified published core, or an optional pinned HTTPS source.
      - name: Prepare required runtime
        uses: ./.github/actions/prepare-miko-runtime
        with:
          core-url: ${{ vars.MIKO_RUNTIME_CORE_URL }}

      - name: Build and scan
        run: cargo xtask release --dry-run --scan --out dist
      # This public repository must not distribute the unreviewed runtime,
      # even as a workflow artifact. Re-enable only after the release review.
      - name: Upload test packages
        if: ${{ false }}
        uses: actions/upload-artifact@v4
        with:
          name: miko-plus-unsigned-test-packages
          path: |
            dist/miko-simulator-*-arm64.dmg
            dist/miko-mcp-*.mcpb
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
