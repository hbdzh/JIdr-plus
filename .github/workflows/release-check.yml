name: Check release packaging

# Manually verify the selected branch without creating a GitHub Release.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Build and scan unsigned test packages
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare release inputs
        uses: ./.github/actions/prepare-release-inputs
        with:
          core-url: ${{ vars.MIKO_RUNTIME_CORE_URL }}

      - name: Build and scan
        run: cargo xtask release --dry-run --scan --out dist
      - name: Prepare runtime source-review materials
        run: cargo xtask prepare-runtime-sources --out dist
      # Test packages stay on the runner while redistribution review remains open.
