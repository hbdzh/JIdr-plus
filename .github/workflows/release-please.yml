name: Release Please

# Changes on master update the version and changelog pull request. Merging it
# creates a draft GitHub Release and tag, then runs the packaging workflow.
# The workflow publishes the draft only after its packaging steps succeed.
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Pull requests opened with the default GITHUB_TOKEN don't trigger
          # CI. A token from RELEASE_PLEASE_TOKEN (a fine-grained PAT or app
          # token with contents and pull-requests write) lets the release PR
          # run the required checks.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: master
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  dmg:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # Grant the called workflow permission to upload release assets.
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
