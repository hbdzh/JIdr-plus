name: Prepare pinned Miko runtime
description: Reconstruct the locally reviewed runtime from pinned archives and a supplied core.
inputs:
  core-url:
    description: Optional HTTPS URL for the pinned arm64 core; defaults to the verified 0.10.0 DMG.
    required: false
runs:
  using: composite
  steps:
    - name: Download and verify runtime inputs
      shell: bash
      env:
        MIKO_CORE_URL: ${{ inputs.core-url }}
      run: |
        set -euo pipefail
        work="$(mktemp -d "$RUNNER_TEMP/miko-runtime.XXXXXX")"
        input() { jq -er --arg key "$1" '.[$key] | strings' "$GITHUB_WORKSPACE/packaging/runtime-source/runtime-inputs.json"; }
        if [ -n "$MIKO_CORE_URL" ]; then
          case "$MIKO_CORE_URL" in
            https://*) ;;
            *) echo '::error::The core URL must be an HTTPS URL'; exit 1 ;;
          esac
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --proto-redir '=https' \
            "$MIKO_CORE_URL" --output "$work/core"
        else
          # The already-published DMG is pinned byte-for-byte before mounting.
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --proto-redir '=https' \
            "$(input fallback_dmg_url)" --output "$work/runtime.dmg"
          echo "$(input fallback_dmg_sha256)  $work/runtime.dmg" | shasum -a 256 -c -
          mkdir "$work/mount"
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$work/mount" "$work/runtime.dmg" >/dev/null
          trap 'hdiutil detach "$work/mount" >/dev/null || true' EXIT
          cp "$work/mount/miko simulator.app/Contents/Resources/sdk/emulator/qemu/darwin-aarch64/qemu-system-aarch64-headless" "$work/core"
          hdiutil detach "$work/mount" >/dev/null
          trap - EXIT
        fi
        expected="$(awk '$2 == "emulator/qemu/darwin-aarch64/qemu-system-aarch64-headless" {print $1}' "$GITHUB_WORKSPACE/packaging/runtime-source/runtime-sha256.txt")"
        actual="$(shasum -a 256 "$work/core" | awk '{print $1}')"
        if [ -z "$expected" ] || [ "$actual" != "$expected" ]; then
          echo '::error::The supplied emulator core does not match the pinned SHA-256'; exit 1
        fi
        curl --fail --silent --show-error --location --retry 3 --proto '=https' --proto-redir '=https' \
          "$(input emulator_url)" --output "$work/emulator.zip"
        curl --fail --silent --show-error --location --retry 3 --proto '=https' --proto-redir '=https' \
          "$(input platform_tools_url)" --output "$work/platform-tools.zip"
        cargo xtask prepare-runtime \
          --emulator-zip "$work/emulator.zip" --platform-tools-zip "$work/platform-tools.zip" \
          --core "$work/core" --output "$work/sdk"
        echo "MIKO_BUNDLED_SDK=$work/sdk" >> "$GITHUB_ENV"
