name: Prepare official Magisk
description: Download and verify the pinned Magisk APK for the application bundle.
runs:
  using: composite
  steps:
    - name: Download and verify Magisk
      shell: bash
      run: |
        set -euo pipefail
        work="$(mktemp -d "$RUNNER_TEMP/miko-magisk.XXXXXX")"
        curl --fail --silent --show-error --location --retry 3 --proto '=https' --proto-redir '=https' \
          'https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk' --output "$work/Magisk-v30.7.apk"
        echo "e0d32d2123532860f97123d927b1bb86c4e08e6fd8a48bfc6b5bee0afae9ebd5  $work/Magisk-v30.7.apk" | shasum -a 256 -c -
        echo "MIKO_BUNDLED_MAGISK=$work/Magisk-v30.7.apk" >> "$GITHUB_ENV"
    - name: Prepare pinned Magisk source and submodules
      shell: bash
      run: |
        set -euo pipefail
        work="$(dirname "$MIKO_BUNDLED_MAGISK")"
        git clone --quiet --branch v30.7 --depth 1 --recurse-submodules --shallow-submodules \
          https://github.com/topjohnwu/Magisk.git "$work/source"
        python3 "$GITHUB_WORKSPACE/scripts/package-magisk-source.py" \
          --source "$work/source" --output "$work/Magisk-v30.7-source.tar"
        echo "6210206eb9d5bdeee30ac6547d8f0ba600d07ffd7475c36fb8f17a741145d7bb  $work/Magisk-v30.7-source.tar" | shasum -a 256 -c -
        echo "MIKO_MAGISK_SOURCE=$work/Magisk-v30.7-source.tar" >> "$GITHUB_ENV"
