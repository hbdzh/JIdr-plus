name: Prepare official Magisk
description: Download and verify the pinned Magisk APK for the application bundle.
runs:
  using: composite
  steps:
    - name: Download and verify Magisk
      shell: bash
      run: |
        set -euo pipefail
        work="$(mktemp -d "$RUNNER_TEMP/miko-magisk.XXXXXX")"
        curl --fail --silent --show-error --location --retry 3 --proto '=https' --proto-redir '=https' \
          'https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk' --output "$work/Magisk-v30.7.apk"
        echo "e0d32d2123532860f97123d927b1bb86c4e08e6fd8a48bfc6b5bee0afae9ebd5  $work/Magisk-v30.7.apk" | shasum -a 256 -c -
        echo "MIKO_BUNDLED_MAGISK=$work/Magisk-v30.7.apk" >> "$GITHUB_ENV"
